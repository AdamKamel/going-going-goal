<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Going, Going, Goal!</title>
<meta name="description" content="A free live football transfer auction. Bid against friends for 11 players, set your XI and win the league.">
<meta name="theme-color" content="#1E7A49">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FFC81E' stroke='%2317241B' stroke-width='2'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Arial' font-weight='700' text-anchor='middle' fill='%2317241B'%3EG%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@500;600;700&display=swap">
<style>/* Layout concept: a floodlit pitch is the auction floor. Everything live happens on the striped stage; paperwork sits around it. */
:root{
  --bg:#E6ECE2; --surface:#FAFCF7; --surface2:#EFF3EA; --ink:#10261C; --mute:#566A5E; --line:#C5D1C2;
  --pitch:#1E7A49; --pitch2:#1A6E41; --pitchline:rgba(255,255,255,.55); --chalk:#F6FAF1; --chalkmute:#C9E2D1;
  --paddle:#FFC81E; --paddle-ink:#17241B; --stamp:#D42F27; --good:#17794A; --warn:#A5660B;
  --card:#FBFCF6; --card-ink:#12261C; --card-mute:#5A6C60; --card-line:#D5DDD0;
  --display:"Big Shoulders Display","Big Shoulders","Impact","Haettenschweiler","Arial Narrow",sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --data:"Spline Sans Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C231B; --surface:#14322699; --surface2:#16362A; --ink:#E9F2E7; --mute:#9DB4A6; --line:#2C4C3D;
  --surface:#132E24; --pitch:#17653C; --pitch2:#145934; --stamp:#F0483E; --good:#57C78E; --warn:#EDB458; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C231B; --surface:#132E24; --surface2:#16362A; --ink:#E9F2E7; --mute:#9DB4A6; --line:#2C4C3D;
  --pitch:#17653C; --pitch2:#145934; --stamp:#F0483E; --good:#57C78E; --warn:#EDB458; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1;text-wrap:balance;letter-spacing:.005em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--paddle);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--data);font-variant-numeric:tabular-nums}
.label{font:600 11px/1.2 var(--data);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}

/* pitch surface */
.pitchbg{background-color:var(--pitch);background-image:repeating-linear-gradient(90deg,var(--pitch) 0 72px,var(--pitch2) 72px 144px);color:var(--chalk)}
.pitchbg .label{color:var(--chalkmute)}
section.pitchbg{overflow:clip}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:2px solid var(--ink);background:transparent;border-radius:6px;font-weight:600;transition:transform .08s,background .15s}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--paddle);border-color:var(--paddle-ink);color:var(--paddle-ink);font-weight:700;box-shadow:0 3px 0 var(--paddle-ink)}
.btn.primary:hover:not(:disabled){background:#FFD54F}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--paddle-ink);transform:translateY(2px)}
.pitchbg .btn{border-color:var(--chalk);color:var(--chalk)}
.pitchbg .btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
.pitchbg .btn.primary{border-color:var(--paddle-ink);color:var(--paddle-ink)}
.pitchbg .btn.primary:hover:not(:disabled){background:#FFD54F}
.btn.small{min-height:34px;padding:4px 10px;font-size:13px;border-width:1.5px}
.btn.quiet{border-color:transparent;text-decoration:underline;text-underline-offset:3px;padding-inline:8px}
input[type=text],input[type=number]{width:100%;min-height:44px;padding:8px 12px;border:2px solid var(--line);background:var(--surface);border-radius:6px}
input:focus{border-color:var(--ink);outline:none}
.pitchbg input{background:var(--chalk);color:var(--card-ink);border-color:var(--paddle-ink)}

/* home */
.hero{padding-block:28px 40px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center}
.mark{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.9;display:flex;flex-direction:column}
.mark span{display:block}
.mark .m1{font-size:clamp(2rem,4.6vw,3.2rem);opacity:.75}
.mark .m2{font-size:clamp(3rem,7.2vw,5.2rem);opacity:.88}
.mark .m3{font-size:clamp(4rem,min(27vw,17vw + 2rem),12.5rem);color:var(--paddle);letter-spacing:-.005em;margin-top:.03em;transform-origin:left bottom;animation:strike .55s cubic-bezier(.2,1.5,.4,1) .15s both}
@keyframes strike{from{transform:scale(1.28) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.pitch-lede{font-size:1.15rem;max-width:44ch;margin-top:18px;color:var(--chalk)}
.start{margin-top:22px;display:grid;gap:12px;max-width:520px}
.start-row{display:flex;gap:10px;flex-wrap:wrap}
.start-row>*{flex:1 1 180px;min-width:0}
.start label{display:block;margin-bottom:4px}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0;text-transform:uppercase;font-family:var(--data);letter-spacing:.14em}
.note{font-size:13px;color:var(--chalkmute);min-height:1.2em}
.hero-demo{position:relative;min-width:0}
.demo-cap{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}
.steps{padding-block:40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.step h3{font-size:1.9rem;margin:6px 0 8px;text-transform:uppercase}
.step .n{font:700 13px var(--data);color:var(--stamp)}
.rules{border-top:2px solid var(--ink);padding-block:26px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.rules h2{font-size:2rem;text-transform:uppercase;margin-bottom:10px}
.rules ul{margin:0;padding-left:18px;display:grid;gap:6px;max-width:60ch}
.foot{font-size:13px;color:var(--mute);padding-block:0 32px;max-width:90ch}

/* player card */
.card{position:relative;background:var(--card);color:var(--card-ink);border-radius:10px;padding:14px;border:1px solid var(--card-line);box-shadow:0 6px 0 rgba(0,0,0,.22);min-width:0}
.card .label{color:var(--card-mute)}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.card-tag{font:700 11px var(--data);letter-spacing:.08em;padding:2px 7px;border-radius:3px;background:var(--card-ink);color:var(--card)}
.card-tag.leg{background:#A67C00;color:#FFF9E3}
.card-main{display:flex;gap:14px;align-items:center;margin-top:10px}
.roundel{flex:0 0 auto;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#17241B;color:var(--paddle);font:900 2.7rem/1 var(--display)}
.card-id{min-width:0}
.card-name{font-size:clamp(1.9rem,4vw,2.6rem);text-transform:uppercase;font-weight:900;line-height:.95;overflow-wrap:anywhere}
.card-sub{color:var(--card-mute);font-size:14px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin-top:14px}
.stat{display:grid;grid-template-columns:34px 26px minmax(0,1fr);align-items:center;gap:6px;font:600 12px var(--data)}
.stat i{display:block;height:6px;background:var(--card-line);border-radius:3px;overflow:hidden}
.stat i b{display:block;height:100%;background:#1E7A49}
.stat i b.hi{background:#C9920E}
.blindnote{margin-top:14px;padding:12px;background:#17241B;color:var(--paddle);font:600 13px var(--data);border-radius:6px;text-align:center}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;overflow:hidden;border-radius:10px}
.stamp div{padding:6px 18px 2px;border:6px solid var(--stamp);border-radius:8px;color:var(--stamp);font:900 clamp(3.2rem,9vw,5rem)/.95 var(--display);text-transform:uppercase;background:rgba(251,252,246,.88);transform:rotate(-8deg);animation:slam .28s cubic-bezier(.2,1.6,.4,1) both;text-align:center;max-width:92%;min-width:0}
.stamp small{display:block;font:700 13px/1.5 var(--data);letter-spacing:.04em;text-transform:none;padding-bottom:6px;overflow-wrap:anywhere}
.stamp.pass div{border-color:#5A6C60;color:#5A6C60}
@keyframes slam{from{transform:rotate(-8deg) scale(2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font:900 1.35rem/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.brand em{font-style:normal;color:var(--stamp)}
.bar .sp{flex:1}
.rounds{display:flex;gap:4px;flex-wrap:wrap}
.rounds span{font:600 11px var(--data);padding:4px 8px;border-radius:4px;border:1.5px solid var(--line);color:var(--mute)}
.rounds span.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rounds span.done{color:var(--good);border-color:var(--good)}

/* lobby */
.lobby-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px;padding-block:6px 40px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h2{font-size:1.7rem;text-transform:uppercase;margin-bottom:12px}
.head{padding:22px 18px;border-radius:10px;margin-bottom:14px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-end}
.head h1{font-size:clamp(2.6rem,7vw,4.2rem);text-transform:uppercase;font-weight:900}
.codebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.code{font:700 1.7rem/1 var(--data);letter-spacing:.14em;background:var(--chalk);color:var(--card-ink);padding:8px 12px;border-radius:6px}
.mlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;background:var(--surface2);min-width:0}
.mrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.paddle{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paddle);color:var(--paddle-ink);font:800 13px var(--data);border:2px solid var(--paddle-ink)}
.chip{flex:0 0 auto;font:700 10px var(--data);letter-spacing:.06em;padding:3px 6px;border-radius:3px;border:1.5px solid var(--line);color:var(--mute);text-transform:uppercase}
.chip.you{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.lead{background:var(--paddle);color:var(--paddle-ink);border-color:var(--paddle-ink)}
.chip.ok{color:var(--good);border-color:var(--good)}
.field{margin-bottom:14px}
.field>.label{display:block;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{min-height:38px;padding:5px 11px;border:1.5px solid var(--line);background:transparent;border-radius:5px;font-size:14px}
.seg button:hover:not(:disabled){border-color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.seg button:disabled:not(.on){opacity:.5}
.warn{color:var(--warn);font-size:13px;margin-top:6px}
.hint{color:var(--mute);font-size:13px;margin-top:5px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px}

/* formation picker */
.form-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr)}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fcard{padding:8px;border:2px solid var(--line);background:var(--surface);border-radius:8px;text-align:left;min-width:0}
.fcard:hover{border-color:var(--ink)}
.fcard.on{border-color:var(--paddle-ink);background:var(--paddle);color:var(--paddle-ink)}
.fcard b{display:block;font:800 1.4rem/1.1 var(--display)}
.fcard small{display:block;font:500 11px var(--data);margin-top:2px}
.mini{position:relative;aspect-ratio:1/1.05;max-width:100%;border-radius:5px;margin-bottom:6px;overflow:hidden}
.mini i{position:absolute;width:9%;aspect-ratio:1;border-radius:50%;background:var(--chalk);transform:translate(-50%,-50%)}
.mini i.gk{background:var(--paddle)}

/* auction */
.auction{display:grid;grid-template-columns:232px minmax(0,1fr) 272px;gap:14px;padding-bottom:30px;align-items:start}
.stage{border-radius:12px;padding:16px;min-width:0;display:grid;gap:12px}
.lot-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:stretch}
.bidbox{display:flex;flex-direction:column;justify-content:center;min-width:0}
.bidnum{font:900 clamp(4.6rem,11vw,7rem)/1 var(--display);color:var(--paddle);overflow-wrap:anywhere}
.bidnum small{font-size:.32em;font-weight:800;margin-left:4px}
.bump{animation:bump .22s ease-out}
@keyframes bump{from{transform:scale(1.2)}to{transform:none}}
.bidby{display:flex;gap:8px;align-items:center;min-height:32px;margin-top:6px;font-weight:600;min-width:0}
.bidby span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.going{font:800 1.5rem/1 var(--display);text-transform:uppercase;min-height:1.6rem;margin-top:8px;color:var(--chalk);letter-spacing:.03em}
.clock{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.fuse{height:12px;border-radius:6px;background:rgba(0,0,0,.28);overflow:hidden}
.fuse div{height:100%;background:var(--paddle);width:100%;transform-origin:left}
.fuse.low div{background:var(--stamp)}
.secs{font:700 1.25rem var(--data);min-width:3.2ch;text-align:right}
.ctl{display:grid;gap:8px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick .btn{min-height:58px;flex-direction:column;gap:0;line-height:1.1;padding:6px}
.quick .btn b{font:900 1.6rem/1 var(--display)}
.quick .btn small{font:600 11px var(--data)}
.ctl-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.statusline{font-size:13px;color:var(--chalkmute);min-height:1.2em}
.statusline b{color:var(--chalk)}
.ctl-msg{padding:14px;background:rgba(0,0,0,.2);border-radius:8px;text-align:center;font-weight:600}
.rail{display:grid;gap:6px;min-width:0}
.rrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.rrow.lead{border-color:var(--paddle-ink);background:var(--paddle);color:var(--paddle-ink)}
.rrow.lead .sub,.rrow.lead .label{color:var(--paddle-ink)}
.rrow.me .nm::after{content:" (you)";font-weight:400;font-size:12px}
.rrow.dim{opacity:.62}
.rrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.rrow .cr{font:700 14px var(--data)}
.rrow .sub{grid-column:2/4;display:flex;justify-content:space-between;gap:6px;font:500 11px var(--data);color:var(--mute)}
.side{display:grid;gap:12px;min-width:0}
.side h3{font-size:1.3rem;text-transform:uppercase;margin-bottom:8px}
.sales{display:grid;gap:5px;font-size:13px}
.sale{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.sale span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tactical pitch */
.tpitch{position:relative;width:100%;aspect-ratio:1/1.12;border-radius:8px;overflow:hidden}
.tpitch svg{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:21%;background:none;border:0;padding:0;color:var(--chalk);text-align:center}
.tok .dot{width:clamp(30px,10vw,46px);height:clamp(30px,10vw,46px);border-radius:50%;display:grid;place-items:center;background:var(--chalk);color:var(--card-ink);font:800 14px var(--data);border:2px solid #17241B}
.tok.empty .dot{background:rgba(255,255,255,.14);color:var(--chalk);border:2px dashed var(--chalk);font-size:10px}
.tok.sel .dot{background:var(--paddle);box-shadow:0 0 0 3px var(--paddle-ink),0 0 0 5px var(--paddle)}
.tok .tn{font:600 11px/1.15 var(--body);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.65)}
.tok .fit{font:700 10px var(--data);color:#17241B;background:var(--paddle);padding:0 4px;border-radius:3px;margin-top:1px}
.tok .fit.bad{background:var(--stamp);color:#fff}
.tpitch.small .tok .dot{width:26px;height:26px;font-size:10px;border-width:1.5px}
.tpitch.small .tok .tn{font-size:10px}
.line-grid{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:18px;padding-bottom:40px;align-items:start}
.ovr-big{font:900 3.6rem/1 var(--display);color:var(--good)}
.timerline{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.timerline .fuse{flex:1;background:var(--line)}

/* match simulator */
.speedbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.speedbar .seg button{min-width:48px;font-family:var(--data);font-weight:700}
.speedbar .sp{flex:1}
.sim-live{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;padding-bottom:40px;align-items:start}
.viewer{display:grid;gap:12px;min-width:0}
.simside{display:grid;gap:12px;min-width:0}
.simside h3,.vgrid h3{font-size:1.3rem;text-transform:uppercase;margin-bottom:8px}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;background:#17241B;color:var(--chalk);border-radius:10px;padding:10px 14px}
.sbt{display:flex;align-items:center;gap:8px;font:800 clamp(.95rem,2.6vw,1.6rem)/1.05 var(--display);text-transform:uppercase;min-width:0;overflow-wrap:break-word}
.sbt span{min-width:0}
.sbt.aw{justify-content:flex-end;text-align:right}
.kit{flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2px solid #F6FAF1}
.kit.home{background:var(--paddle);border-color:var(--paddle)}
.kit.away{background:#17241B}
.sbc{text-align:center}
.sbs{font:900 clamp(2.2rem,6vw,3.2rem)/1 var(--display);color:var(--paddle)}
.sbm{font:700 13px var(--data);margin-top:2px}
.pens{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:6px;font:700 13px var(--data)}
.pen{width:11px;height:11px;border-radius:50%;background:var(--good)}
.pen.off{background:var(--stamp)}
.pen.aw{outline:2px solid var(--ink);outline-offset:1px}
.canvwrap{position:relative;aspect-ratio:100/60;max-width:100%;border-radius:10px;overflow:hidden}
#pitchcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.flash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.35);pointer-events:none;text-align:center;padding:8px}
.flash strong{font:900 clamp(3rem,10vw,6rem)/1 var(--display);color:var(--paddle);text-transform:uppercase;animation:slam2 .25s ease-out both}
.flash span{font:800 clamp(1.1rem,3vw,1.8rem)/1.1 var(--display);color:#fff;text-transform:uppercase}
@keyframes slam2{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.srow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:2px 6px;align-items:center;margin-bottom:7px;font-size:13px}
.srow .num:last-of-type{text-align:right}
.slab{text-align:center;color:var(--mute);font-size:12px}
.sbar{grid-column:1/-1;height:6px;background:var(--ink);border-radius:3px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--paddle)}
.comm{display:grid;gap:5px;font-size:13px}
.cline{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px}
.cline b.num{color:var(--mute);font-weight:600}
.cline.g{background:var(--paddle);color:var(--paddle-ink);padding:3px 5px;border-radius:4px}
.cline.g b.num{color:var(--paddle-ink)}
.fix2{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;width:100%;padding:7px 6px;background:transparent;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit}
button.fix2:hover{background:var(--surface2)}
.fix2.on{background:var(--surface2);box-shadow:inset 3px 0 0 var(--paddle)}
.fix2.muted{opacity:.6}
.fix2 .a{text-align:right}
.fix2 .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500;font-size:14px}
.fix2 .t.me{font-weight:800}
.fix2 .score{font-size:1.15rem;min-width:48px;padding:3px 6px}

/* tournament */
.sim-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px;padding-bottom:40px;align-items:start}
.fix{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.fix:last-child{border-bottom:0}
.fix .a{text-align:right}
.fix .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500}
.fix .t.me{font-weight:800}
.score{font:900 1.5rem/1 var(--display);background:var(--ink);color:var(--bg);padding:4px 10px;border-radius:4px;min-width:62px;text-align:center}
.scroll-x{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:600 11px var(--data);text-align:right;color:var(--mute);padding:4px 6px;border-bottom:2px solid var(--ink)}
.tbl td{text-align:right;padding:6px;border-bottom:1px solid var(--line);font-family:var(--data);font-size:13px}
.tbl .tn,.tbl th.tn{text-align:left;font-family:var(--body);font-weight:600;font-size:14px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl tr.me td{background:var(--surface2)}
.tbl .pts{font-weight:800}
.tbl tr.q td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.final{padding:22px 18px;border-radius:12px;text-align:center;margin-bottom:16px}
.final h1{font-size:clamp(2.6rem,8vw,4.6rem);text-transform:uppercase;font-weight:900}
.board{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;margin-top:16px}
.board .side-n{font:800 clamp(1.3rem,4vw,2.3rem)/1 var(--display);text-transform:uppercase;overflow-wrap:anywhere}
.board .sc{font:900 clamp(3.8rem,13vw,7.4rem)/.9 var(--display);color:var(--paddle)}
.minute{font:700 15px var(--data);margin-top:10px}
.feed{display:grid;gap:6px;max-width:680px;margin:0 auto 16px}
.goal{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px}
.goal b{font-family:var(--data)}
.champ{padding:30px 18px;border-radius:12px;margin-bottom:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:20px;align-items:center}
.champ h1{font-size:clamp(3.2rem,11vw,7rem);text-transform:uppercase;font-weight:900;color:var(--paddle);overflow-wrap:anywhere;line-height:.9}
.res-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-bottom:30px;align-items:start}
.awards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.award b{display:block;font:800 1.45rem/1.05 var(--display);text-transform:uppercase;margin:3px 0 2px;overflow-wrap:anywhere}
.award small{color:var(--mute);font-size:13px}
details.sq{border-top:1px solid var(--line);padding:8px 0}
details.sq summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.sqlist{display:grid;gap:3px;margin-top:6px;font-size:13px}
.sqlist div{display:grid;grid-template-columns:38px minmax(0,1fr) 30px 44px;gap:6px}
.banner{padding-block:8px;background:var(--paddle);color:var(--paddle-ink);font-weight:600;font-size:14px;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.err{color:var(--stamp);font-weight:600;font-size:14px}

  .auction{grid-template-columns:minmax(0,1fr) 262px}

  .roundel{width:60px;height:60px;font-size:2.1rem}

  .bidbox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 12px;align-items:center}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>// Live lobby connection for the web version. Gives the game the same room calls it uses elsewhere.
window.GGG_WEB = true;
window.GGG_ROOM = (() => {
  class Channel {
    constructor(name) {
      this.name = name; this.mine = {}; this.others = new Map(); this.peerId = 'me'; this.subs = new Set(); this.conns = new Set();
      this.isOpen = false; this.left = false; this.retry = 0; this.ws = null;
    }
    connect(onFirst, onFail) {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      let ws;
      try { ws = new WebSocket(proto + '//' + location.host + '/ws'); } catch (e) { if (onFail) onFail(); return; }
      this.ws = ws;
      ws.onopen = () => ws.send(JSON.stringify({ t: 'join', room: this.name, presence: this.mine }));
      ws.onmessage = ev => {
        let m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'welcome') {
          this.peerId = m.peer; this.others = new Map(m.peers.map(p => [p.peer, p.presence]));
          this.setOpen(true); this.retry = 0;
          if (onFirst) { const f = onFirst; onFirst = null; onFail = null; f(this); }
          this.fire();
        } else if (m.t === 'peer') { this.others.set(m.peer, m.presence); this.fire(); } else if (m.t === 'left') { this.others.delete(m.peer); this.fire(); } else if (m.t === 'full' && onFail) { const f = onFail; onFirst = null; onFail = null; f(); }
      };
      ws.onclose = () => {
        if (this.ws !== ws) return;
        this.setOpen(false);
        if (this.left) return;
        if (onFail) { const f = onFail; onFirst = null; onFail = null; f(); return; }
        this.retry++;
        clearTimeout(this.timer);
        this.timer = setTimeout(() => this.connect(), Math.min(5000, 400 * this.retry));
      };
      ws.onerror = () => { try { ws.close(); } catch (e) { /* closing anyway */ } };
    }
    setOpen(v) { if (this.isOpen !== v) { this.isOpen = v; this.conns.forEach(f => f(v)); } }
    fire() { const ps = this.peers(); this.subs.forEach(f => f({ peers: ps, joined: [], left: [], updated: [] })); }
    peers() {
      const list = [{ peer: this.peerId, isMe: true, sameTab: true, presence: this.mine }];
      this.others.forEach((presence, peer) => list.push({ peer, isMe: false, sameTab: false, presence }));
      return list;
    }
    presence(patch) {
      Object.keys(patch).forEach(k => { if (patch[k] === null) delete this.mine[k]; else this.mine[k] = patch[k]; });
      if (this.isOpen && this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify({ t: 'p', patch }));
      return Promise.resolve();
    }
    onPeers(f) { this.subs.add(f); setTimeout(() => { if (this.subs.has(f)) f({ peers: this.peers(), joined: [], left: [], updated: [] }); }, 0); return () => this.subs.delete(f); }
    onConnection(f) { this.conns.add(f); setTimeout(() => { if (this.conns.has(f)) f(this.isOpen); }, 0); return () => this.conns.delete(f); }
    connected() { return this.isOpen; }
    leave() { this.left = true; clearTimeout(this.timer); clearInterval(this.pinger); document.removeEventListener('visibilitychange', this.onVis); if (this.ws) this.ws.close(); return Promise.resolve(); }
  }
  return {
    join: name => new Promise((resolve, reject) => {
      const ch = new Channel(name);
      const limit = setTimeout(() => { ch.left = true; if (ch.ws) ch.ws.close(); reject({ code: 'upstream_error' }); }, 15000);
      ch.connect(c => {
        clearTimeout(limit);
        // Phones drop connections in the background, so reconnect as soon as the game is visible again.
        ch.onVis = () => { if (!document.hidden && !ch.isOpen && !ch.left) { clearTimeout(ch.timer); if (!ch.ws || ch.ws.readyState > 1) ch.connect(); } };
        document.addEventListener('visibilitychange', ch.onVis);
        ch.pinger = setInterval(() => { if (ch.ws && ch.ws.readyState === 1) ch.ws.send('{"t":"ping"}'); }, 25000);
        resolve(c);
      }, () => { clearTimeout(limit); reject({ code: 'upstream_error' }); });
    }),
  };
})();

  const curCat = s => POS[s.pi];
  const minCost = s => Math.max(1, Math.ceil(s.cfg.budget / 100));

  const startGame = (s, seed) => {
    s.seed = seed >>> 0;
    s.phase = 'form';
    s.t = 30000;
    s.pi = 0; s.di = [0, 0, 0, 0]; s.k = 0; s.lot = null; s.log = [];
    s.m.forEach(m => {
      m.b = s.cfg.budget; m.s = []; m.p = []; m.tac = 0; m.r = 0;
      if (m.bot) { const r = rng(hash(s.seed, s.m.indexOf(m))); m.f = Math.floor(r() * FORMATIONS.length); m.r = 1; }
    });

    s.v++;
    maybeLeaveForm(s);
  };

  const maybeLeaveForm = s => {
    if (s.phase === 'form' && (s.t <= 0 || s.m.every(m => m.r || !m.on))) beginAuction(s);
  };
  const beginAuction = s => {
    s.phase = 'auction';
    s.m.forEach(m => { m.r = 0; });
    nextLot(s);
  };

  const nextLot = s => {
    s._sb = {}; s._bw = {}; s._bv = {};
    const deck = deckFor(s);
    while (s.pi < 4) {
      const cat = POS[s.pi];
      if (!s.m.some(m => need(m, cat) > 0)) { s.pi++; continue; }
      if (s.di[s.pi] >= deck[cat].length) {
        // Pool exhausted: remaining slots go to free academy players.
        s.m.forEach(m => { while (need(m, cat) > 0) { m.s.push(-1 - s.pi); m.p.push(0); } });
        s.pi++;
        continue;
      }
      const pid = deck[cat][s.di[s.pi]++];
      s.k++;
      s.lot = { k: s.k, pid, b: 0, by: -1, out: [], sub: [], done: null };
      s.t = s.cfg.timer * 1000;
      s.v++;
      // The last manager needing this position gets whoever comes up, at the minimum price.
      const needing = s.m.map((m, i) => (need(m, cat) > 0 ? i : -1)).filter(i => i >= 0);
      if (needing.length === 1) {

  };

  const canBid = (s, i) => {
    const l = s.lot, m = s.m[i];

    if (need(m, curCat(s)) <= 0 || l.out.includes(i)) return false;

  const anyCanBid = s => s.m.some((_, i) => canBid(s, i));

  const finishLot = (s, by, price, reveal, auto) => {
    const l = s.lot;

        if (fine > 0) { m.b -= fine; l.done.fined.push([i, fine]); }

    for (let i = 0; i < s.m.length; i++) {

      s._bw[i] -= dt;
      if (s._bw[i] > 0) continue;

      const v = s._bv[i], l = s.lot;

      } else if (l.b >= v || v < 1) {

      } else {

        let next = l.b === 0 ? Math.max(1, Math.round(v * (0.2 + r() * 0.3))) : l.b + (r() < 0.22 ? 5 * unit : unit);
        next = Math.max(l.b + 1, Math.min(next, v, maxBid(m)));

    }
  };

    return best;
  };

      return order[bestJ];
    });

    let improved = true, guard = 0;
    while (improved && guard++ < 40) {
      improved = false;
      for (let a = 0; a < 11; a++) for (let b = a + 1; b < 11; b++) {
        const cur = effective(getP(order[a]), slots[a].role) + effective(getP(order[b]), slots[b].role);
        const alt = effective(getP(order[b]), slots[a].role) + effective(getP(order[a]), slots[b].role);
        if (alt > cur) { [order[a], order[b]] = [order[b], order[a]]; improved = true; }
      }
    }
    return order;
  };
  const teamOverall = m => {
    const slots = FORMATIONS[m.f].slots;
    const n = m.s.length;
    if (!n) return 0;
    return Math.round(m.s.reduce((t, id, j) => t + effective(getP(id), n === 11 ? slots[j].role : getP(id).pos), 0) / n);
  };

  const beginLineup = s => {
    s.phase = 'line';
    s.lot = null;
    s.t = 60000;
    s.m.forEach((m, i) => {
      const before = m.s.map((id, j) => [id, m.p[j]]);
      m.s = bestOrder(m.f, m.s);
      m.p = m.s.map(id => { const j = before.findIndex(x => x[0] === id); return before.splice(j, 1)[0][1]; });
      m.r = m.bot ? 1 : 0;
      if (m.bot) m.tac = hash(s.seed, i) % 3;
    });
    s.v++;
    maybeSim(s);
  };
  const maybeSim = s => {
    if (s.phase === 'line' && (s.t <= 0 || s.m.every(m => m.r || !m.on))) { s.phase = 'sim'; s.t = 0; s.sim = { t: 0, sp: 1 }; s.v++; }
  };
  const resetToLobby = s => {
    s.phase = 'lobby'; s.lot = null; s.t = 0; s.log = []; s.k = 0; s.sim = null;
    s.m = s.m.filter(m => m.bot || m.on);
    s.m.forEach(m => { m.s = []; m.p = []; m.r = 0; m.b = s.cfg.budget; });
    s.v++;
  };

  // ---- match simulation (only + - * / on doubles, so every browser computes identical results) ----
  const W = {
    att: { ST: 1.2, CF: 1.1, LW: 1, RW: 1, CAM: .8, LM: .7, RM: .7, CM: .45, CDM: .2, LWB: .25, RWB: .25, LB: .15, RB: .15, CB: .05, GK: 0 },
    cre: { CAM: 1, CM: 1, CDM: .7, LM: .8, RM: .8, LW: .6, RW: .6, CF: .4, ST: .25, LWB: .35, RWB: .35, LB: .35, RB: .35, CB: .1, GK: 0 },
    def: { CB: 1.1, LB: .8, RB: .8, LWB: .7, RWB: .7, CDM: .8, CM: .4, LM: .25, RM: .25, CAM: .1, LW: .05, RW: .05, CF: .02, ST: .02, GK: 0 },
  };
  const profile = m => {
    const slots = FORMATIONS[m.f].slots;
    let A = 0, aw = 0, C = 0, cw = 0, D = 0, dw = 0, K = 50, P = 0, pw = 0;
    const rows = m.s.map((id, j) => {
      const p = getP(id), role = slots[j].role, pen = fitPenalty(p, role);
      if (role === 'GK') {
        K = p.cat === 'GK' ? p.ovr - pen : p.ovr - 25;
        return { p, role, sho: 0, pas: 0 };
      }
      const st = p.cat === 'GK' ? [30, 20, 40, 25, 30, 50] : p.st;
      const pac = st[0] - pen, sho = st[1] - pen, pas = st[2] - pen, dri = st[3] - pen, de = st[4] - pen, phy = st[5] - pen;
      const wa = W.att[role], wc = W.cre[role], wd = W.def[role];
      A += wa * (.5 * sho + .25 * dri + .25 * pac); aw += wa;
      C += wc * (.6 * pas + .4 * dri); cw += wc;
      D += wd * (.7 * de + .3 * phy); dw += wd;
      if (CAT[role] !== 'DEF') { P += pac; pw++; }
      return { p, role, sho, pas };
    });
    const q = quota(m.f);
    return { A: A / aw, C: C / cw, D: D / dw, K, P: P / pw, nD: q.DEF, nF: q.FWD, tac: m.tac, rows };
  };
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const xgFor = (t, o, home) => {
    const att = .6 * t.A + .4 * t.C, def = .8 * o.D + .2 * o.K;
    let x = 1.2 + .068 * (att - def) + .05 * (t.nF - 2) - .05 * (o.nD - 4) + (home ? .14 : -.02);
    if (t.tac === 2) x *= 1.16;
    if (o.tac === 2) x *= t.tac === 1 ? 1.26 : 1.12;
    if (t.tac === 1) x *= .9 + clamp(t.P - 75, -10, 15) * .006;
    if (o.tac === 1) x *= .94;
    return clamp(x, .15, 4.6);
  };
  const pickWeighted = (rows, weight, r, skip) => {
    let total = 0;
    const w = rows.map(row => { const v = row === skip ? 0 : weight(row); total += v; return v; });
    let at = r() * total;
    for (let i = 0; i < rows.length; i++) { at -= w[i]; if (at <= 0 && w[i] > 0) return rows[i]; }
    return rows[rows.length - 1];
  };
  const shotWeight = row => { const b = W.att[row.role] + .03; const q = row.sho - 35; return row.role === 'GK' ? 0 : b * q * q; };
  const passWeight = row => { const b = W.cre[row.role] + .08; const q = row.pas - 35; return row.role === 'GK' ? 0 : b * q * q; };
  const playMatch = (s, h, a, seedKey, knockout) => {
    const r = rng(hash(s.seed, seedKey, h, a));
    const ph = profile(s.m[h]), pa = profile(s.m[a]);
    const xh = xgFor(ph, pa, !knockout), xa = xgFor(pa, ph, false);
    const ev = [];
    let hg = 0, ag = 0;
    for (let min = 1; min <= 90; min++) {
      const side = r() < xh / 90 ? 0 : r() < xa / 90 ? 1 : -1;

      const rows = side === 0 ? ph.rows : pa.rows;
      const sc = pickWeighted(rows, shotWeight, r);
      const as = r() < .74 ? pickWeighted(rows, passWeight, r, sc) : null;

  };
  // The story around the score: possession, chances, corners and bookings. Uses its own random stream, so it can never change a result.
  const matchDetail = (s, x) => {
    const r = rng(hash(s.seed, x.key, x.h, x.a, 7919));
    const ph = profile(s.m[x.h]), pa = profile(s.m[x.a]);
    const xs = [xgFor(ph, pa, !x.ko), xgFor(pa, ph, false)];
    const lean = t => (t === 1 ? -.05 : t === 2 ? .03 : 0);
    const share = clamp(.5 + (ph.C - pa.C) * .012 + lean(ph.tac) - lean(pa.tac), .3, .7);
    const poss = [];
    let cur = r() < share ? 0 : 1;
    for (let min = 0; min <= 91; min++) { if (r() > .62) cur = r() < share ? 0 : 1; poss.push(cur); }
    const goalAt = {};
    x.ev.forEach(e => { goalAt[e.min] = e; poss[e.min] = e.side; if (e.min > 0) poss[e.min - 1] = e.side; });
    const events = [];
    for (let min = 1; min <= 90; min++) {
      const g = goalAt[min];
      if (g) { events.push({ min, type: 'goal', side: g.side, pid: g.sc, as: g.as }); continue; }
      const side = poss[min], rows = side === 0 ? ph.rows : pa.rows, foes = side === 0 ? pa.rows : ph.rows;
      const a = r(), b = r(), c = r(), d = r();

  const roundRobin = (n, rounds) => {

  const emptyRow = i => ({ i, pl: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 });
  const tableFrom = (n, matchdays) => {
    const t = [...Array(n).keys()].map(emptyRow);
    matchdays.forEach(md => md.forEach(x => {
      const A = t[x.h], B = t[x.a];

    const sl = E.FORMATIONS[teams[side].f].slots[j];
    const owning = side === 0 ? attack : 1 - attack;
    const shift = j === 0 ? 0 : .02 + owning * .2;
    let u = .05 + (100 - sl.y) / 100 * .46 + shift, v = .08 + sl.x / 100 * .84;
    if (!still && j !== 0) { u += Math.sin(g * 1.1 + j * 1.7 + side) * .012; v += Math.cos(g * .8 + j * 2.3 + side) * .018; }
    return side === 0 ? [u, v] : [1 - u, 1 - v];
  };
  const seed = s.seed ^ (x.key * 131);
  const ownerAt = n => {
    const mi = Math.min(91, Math.floor(n * .45)), side = d.poss[mi] || 0;
    return [side, 1 + (E.hash(seed, n) % 10)];
  };
  const n = Math.floor(g / .45), f = g / .45 - n;
  const a0 = ownerAt(n), a1 = ownerAt(n + 1);
  let holder = a0, ball = null;
  const ev = g >= 90 ? null : d.events.find(e => (e.type === 'goal' || e.type === 'save' || e.type === 'miss') && g >= e.min && g < e.min + 1);
  const afterGoal = g >= 90 ? false : d.events.some(e => e.type === 'goal' && g >= e.min + 1 && g < e.min + 2);
  if (g >= 90 || g < .2 || afterGoal) { ball = [.5, .5]; holder = null; } else if (ev) {
    const j = Math.max(1, teams[ev.side].s.indexOf(ev.pid));
    const from = pos(ev.side, j), goalU = ev.side === 0 ? 1 : 0;
    const k = Math.min(1, (g - ev.min) * 2.2);
    const lanes = { goal: .5, save: .5, miss: (E.hash(seed, ev.min) % 2) ? .3 : .7 };
    const target = ev.type === 'save' ? pos(1 - ev.side, 0) : [goalU, lanes[ev.type]];
    ball = [from[0] + (target[0] - from[0]) * k, from[1] + (target[1] - from[1]) * k];
    holder = [ev.side, j];
  } else if (still) { ball = pos(a0[0], a0[1]); } else {
    const p0 = pos(a0[0], a0[1]), p1 = pos(a1[0], a1[1]), e = f < .5 ? 0 : (f - .5) * 2; // hold, then pass
    ball = [p0[0] + (p1[0] - p0[0]) * e, p0[1] + (p1[1] - p0[1]) * e];
  }
  const colors = [{ fill: css.getPropertyValue('--paddle').trim() || '#FFC81E', edge: '#17241B' }, { fill: '#17241B', edge: '#F6FAF1' }];
  const r = Math.max(5, Math.min(w, h) * .022);
  [0, 1].forEach(side => {
    teams[side].s.forEach((id, j) => {
      const [u, v] = pos(side, j), own = holder && holder[0] === side && holder[1] === j;
      c.beginPath(); c.arc(PX(u), PY(v), own ? r * 1.25 : r, 0, 6.2832);
      c.fillStyle = colors[side].fill; c.fill(); c.lineWidth = j === 0 ? 2.5 : 1.5; c.strokeStyle = colors[side].edge; c.stroke();
    });
  });
  if (holder) {
    const p = E.getP(teams[holder[0]].s[holder[1]]), [u, v] = pos(holder[0], holder[1]);
    c.font = `600 ${Math.max(11, Math.min(14, w * .022))}px ${css.getPropertyValue('--body')}`;
    c.textAlign = 'center';
    const label = shortName(p.name), ty = Math.max(14, PY(v) - r * 1.8);
    c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.65)'; c.strokeText(label, Math.min(w - 40, Math.max(40, PX(u))), ty);
    c.fillStyle = '#FFFFFF'; c.fillText(label, Math.min(w - 40, Math.max(40, PX(u))), ty);
  }
  if (ball) {
    c.beginPath(); c.arc(PX(ball[0]), PY(ball[1]), Math.max(3.5, r * .55), 0, 6.2832);
    c.fillStyle = '#FFFFFF'; c.fill(); c.lineWidth = 1.5; c.strokeStyle = '#000000'; c.stroke();
  }
};

// Timer display runs on its own loop so typing and focus are never disturbed.
const frame = () => {

// ---- host loop ----
let lastTick = performance.now();
setInterval(() => {
  const now = performance.now(), dt = Math.min(now - lastTick, 2000);
  lastTick = now;
  if (!App.s || !App.isHost) return;

// ---- live lobbies, built on the viewer's room presence ----
// The host browser runs the engine and publishes the whole game state in its presence.
// Other browsers publish a short list of their latest actions. Anyone with room access can
// set presence, so all of it is validated by the engine before it counts.
class Net {
  constructor(room, code, isHost) { this.room = room; this.code = code; this.host = isHost; this.seen = {}; this.q = Date.now(); this.acts = []; this.lastSt = null; this.lastSent = 0; this.lastV = -1; this.hostGone = 0; this.unsub = []; }
  async open() {
    let ch;
    try { ch = await this.room.join('ggg-' + this.code.toLowerCase()); } catch (e) { if (e && e.code === 'not_permitted') ch = this.room; else throw e; }
    this.ch = ch;
    await ch.presence(this.base());
    this.unsub.push(ch.onPeers(() => this.sync(), () => {}));
    this.unsub.push(ch.onConnection(c => { setBanner(c ? '' : 'Reconnecting…'); }, () => {}));
    this.timer = setInterval(() => this.watch(), 1000);
  }
  base() { return { g: this.code, id: myId, n: STORE.get('ggg-name') || 'Manager', a: [] }; }
  peers() { return (this.ch ? this.ch.peers() : []).filter(p => p.presence && p.presence.g === this.code && typeof p.presence.id === 'string'); }
  broadcast(force) {
    const s = App.s;
    if (!this.ch || !s) return;
    const now = performance.now();
    if (!force && s.v === this.lastV && now - this.lastSent < 1000) return;
    this.lastV = s.v; this.lastSent = now;
    this.ch.presence({ h: 1, st: E.snapshot(s) }).catch(() => {});
  }
  send(act) {
    this.q++;
    this.acts.push({ q: this.q, ...act });
    if (this.acts.length > 6) this.acts.shift();
    this.ch.presence({ a: this.acts }).catch(() => {});
  }
  sync() {
    if (!this.ch) return;
    if (this.host) this.syncHost(); else this.syncClient();
  }
  syncHost() {
    const s = App.s, ps = this.peers();
    if (!s) return;
    if (ps.some(p => p.presence.id !== myId && p.presence.h && p.presence.st && (p.presence.st.v > s.v || (p.presence.st.v === s.v && p.presence.id < myId)))) {
      this.host = false; App.isHost = false;
      this.ch.presence({ h: null, st: null }).catch(() => {});
      this.syncClient();
      return;
    }
    let changed = false;
    const present = new Set(ps.map(p => p.presence.id));
    present.add(myId);
    ps.forEach(p => {
      const id = p.presence.id;
      if (id === myId) return;
      let i = s.m.findIndex(m => m.id === id);
      if (i < 0 && s.phase === 'lobby' && s.m.length < 10) {
        s.m.push(E.newManager(id, cleanName(p.presence.n), false));
        s.m[s.m.length - 1].b = s.cfg.budget;
        i = s.m.length - 1; changed = true;
      }
      if (i < 0) return;
      const m = s.m[i];
      if (!m.on) { m.on = 1; changed = true; }
      if (s.phase === 'lobby') { const nn = cleanName(p.presence.n); if (m.n !== nn) { m.n = nn; changed = true; } }
      const list = Array.isArray(p.presence.a) ? p.presence.a : [];
      list.forEach(a => {
        if (!a || !Number.isInteger(a.q) || a.q <= (this.seen[id] || 0)) return;
        this.seen[id] = a.q;
        if (E.act(s, i, { k: a.k, v: a.v })) changed = true;
      });
    });
    const keep = [];
    s.m.forEach(m => {
      if (m.bot || present.has(m.id)) { keep.push(m); return; }
      if (s.phase === 'lobby') { changed = true; return; } // left before the sale started
      if (m.on) { m.on = 0; changed = true; }
      keep.push(m);
    });
    s.m = keep;
    if (changed) { s.v++; this.broadcast(true); render(); }
  }
  syncClient() {
    const hostPeer = this.peers().filter(p => p.presence.h && p.presence.st && p.presence.id !== myId).sort((a, b) => b.presence.st.v - a.presence.st.v)[0];
    if (!hostPeer) return;
    this.hostGone = 0;
    const st = hostPeer.presence.st;
    if (st === this.lastSt) return;
    this.lastSt = st;
    App.s = st; App.recvAt = performance.now();
    if (App.joining) { App.joining = false; App.msg = ''; setHash('join-' + this.code); }
    setBanner('');
    render();
  }
  // If the host's browser disappears, the next connected human picks the game up from the last snapshot.
  watch() {
    if (this.host) { this.syncHost(); return; }
    const s = App.s, ps = this.peers();
    if (ps.some(p => p.presence.h && p.presence.st && p.presence.id !== myId)) { this.hostGone = 0; return; }
    this.hostGone++;
    if (!s) {
      if (App.joining && this.hostGone >= 7) { const c = this.code; leaveGame(); App.msg = `No lobby found for ${c}. Check the code with your host.`; render(); }
      return;
    }
    if (this.hostGone < 5) { if (this.hostGone >= 2) setBanner('The host dropped out. Waiting…'); return; }
    const ids = new Set(ps.map(p => p.presence.id));
    const next = s.m.find(m => !m.bot && ids.has(m.id));
    if (next && next.id === myId) {
      App.s = JSON.parse(JSON.stringify(s));
      App.s._sb = {}; App.s._bw = {}; App.s._bv = {};
      App.isHost = true; this.host = true; setBanner('');
      ps.forEach(p => { const list = Array.isArray(p.presence.a) ? p.presence.a : []; list.forEach(a => { if (a && Number.isInteger(a.q)) this.seen[p.presence.id] = Math.max(this.seen[p.presence.id] || 0, a.q); }); });
      this.ch.presence({ a: [] }).catch(() => {});
      this.broadcast(true);
      render();
    }
  }
  close() {
    clearInterval(this.timer);
    this.unsub.forEach(u => { try { u(); } catch (e) { /* already gone */ } });
    if (this.ch && this.ch.leave) this.ch.leave().catch(() => {});
    else if (this.ch) this.ch.presence({ g: null, id: null, st: null, h: null, a: null }).catch(() => {});
    this.ch = null;
  }
}

// ---- actions ----
const readName = () => {
  const el = $('mgrname');
  const n = cleanName(el ? el.value : STORE.get('ggg-name'));
  STORE.set('ggg-name', n);
  return n;
};
const makeCode = () => { const c = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let o = ''; for (let i = 0; i < 5; i++) o += c[Math.floor(Math.random() * c.length)]; return o; };
const setHash = h => { try { if (h) location.hash = h; else history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* hash is a convenience */ } };
const startSolo = () => {
  const s = E.newState('SOLO');
  s.m.push(E.newManager(myId, readName(), false));
  E.addBot(s); E.addBot(s); E.addBot(s);
  App.s = s; App.isHost = true; App.net = null; App.msg = ''; setBanner('');
  render();
};
const startHost = async () => {
  if (!App.roomApi) return;
  const name = readName(), code = makeCode(), s = E.newState(code);
  s.m.push(E.newManager(myId, name, false));
  App.s = s; App.isHost = true; App.code = code; App.msg = ''; setBanner('');
  const net = new Net(App.roomApi, code, true);
  App.net = net;
  render();
  try {
    await net.open();
    net.broadcast(true);
    setHash('join-' + code);
  } catch (e) {

    App.msg = 'That lobby couldn\'t open right now. Try again in a moment, or play against AI.';

};
const startJoin = async () => {
  if (!App.roomApi) return;
  const el = $('joincode');
  const code = (el ? el.value : '').trim().toUpperCase();
  if (!/^[A-Z0-9]{5}$/.test(code)) { App.msg = 'Lobby codes have 5 letters and numbers.'; render(); return; }
  readName();
  App.msg = `Looking for lobby ${code}…`; App.joining = true; App.code = code; App.isHost = false;
  render();
  const net = new Net(App.roomApi, code, false);
  App.net = net;
  try {
    await net.open();
    net.sync();
  } catch (e) {
    leaveGame();
    App.msg = 'That lobby couldn\'t be reached. Check the code and try again.';
    render();
  }
};
const leaveGame = () => {
  if (App.net) App.net.close();
  App.net = null; App.s = null; App.isHost = false; App.code = null; App.joining = false; setBanner(''); App.reel = null; App.sel = -1;
  setHash('');
  demo.t = null;
};
const doAct = a => {
  const s = App.s;
  if (!s) return;
  if (App.isHost) { if (E.act(s, me(), a)) { if (App.net) App.net.broadcast(true); render(); } } else if (App.net) App.net.send(a);
};

const handlers = {
  solo: startSolo, host: startHost, join: startJoin,
  sound(el) { App.sound = !App.sound; STORE.set('ggg-sound', App.sound ? '1' : '0'); if (App.sound) beep(660, .06); el.textContent = 'Sound ' + (App.sound ? 'on' : 'off'); el.setAttribute('aria-pressed', App.sound); },
  leave(el) {
    if (el.dataset.sure !== '1') {
      el.dataset.sure = '1'; el.textContent = 'Really leave?';
      setTimeout(() => { if (el.isConnected) { el.dataset.sure = ''; el.textContent = 'Leave'; } }, 3000);
      return;
    }
    leaveGame(); App.msg = ''; render();
  },
  addbot() { if (App.isHost && E.addBot(App.s)) { if (App.net) App.net.broadcast(true); render(); } },
  rmbot(el) { if (!App.isHost) return; const i = +el.dataset.v; if (App.s.m[i] && App.s.m[i].bot) { App.s.m.splice(i, 1); App.s.v++; if (App.net) App.net.broadcast(true); render(); } },
  cfg(el) {
    if (!App.isHost) return;
    const k = el.dataset.k, raw = el.dataset.v, c = App.s.cfg;
    if (['blind', 'sealed', 'showOvr'].includes(k)) c[k] = raw === '1'; else if (['budget', 'timer', 'rounds'].includes(k)) c[k] = +raw; else c[k] = raw;
    App.s.v++;
    App.s.m.forEach(m => { m.b = c.budget; });
    if (App.net) App.net.broadcast(true);
    render();
  },
  copy(el) {
    const code = App.s.code;
    const ok = () => { el.textContent = 'Copied'; setTimeout(() => { if (el.isConnected) el.textContent = 'Copy code'; }, 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(ok).catch(() => { el.textContent = code; });
    else el.textContent = code;
  },
  copylink(el) {
    const link = location.origin + location.pathname + '#join-' + App.s.code;
    const ok = () => { el.textContent = 'Link copied'; setTimeout(() => { if (el.isConnected) el.textContent = 'Copy invite link'; }, 1400); };
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(ok).catch(() => { el.textContent = link; });
    else el.textContent = link;
  },
  start() { if (!App.isHost || App.s.m.length < 2) return; const seed = Math.floor(Math.random() * 4294967295); E.startGame(App.s, seed); if (App.net) App.net.broadcast(true); render(); },
  form(el) { doAct({ k: 'form', v: +el.dataset.v }); },
  ready() { doAct({ k: 'ready' }); },
  bid(el) { doAct({ k: 'bid', v: +el.dataset.v }); },
  bidc() { const i = $('bidamt'), v = parseInt(i && i.value, 10); if (Number.isInteger(v)) { doAct({ k: 'bid', v }); i.value = ''; } },
  seal() { const i = $('bidamt'), v = parseInt(i && i.value, 10); if (Number.isInteger(v) && v >= 1) { doAct({ k: 'seal', v }); } },
  out() { doAct({ k: 'out' }); },
  tac(el) { doAct({ k: 'tac', v: +el.dataset.v }); },
  tok(el) {
    const j = +el.dataset.v, m = App.s.m[me()];
    if (App.sel < 0) { App.sel = j; render(); return; }
    if (App.sel === j) { App.sel = -1; render(); return; }
    const o = m.s.slice();
    [o[App.sel], o[j]] = [o[j], o[App.sel]];
    App.sel = -1;
    if (App.isHost) { E.act(App.s, me(), { k: 'order', v: o }); if (App.net) App.net.broadcast(true); render(); } else { doAct({ k: 'order', v: o }); render(); }
  },
  autoxi() { const m = App.s.m[me()]; App.sel = -1; doAct({ k: 'order', v: E.bestOrder(m.f, m.s) }); },
  speed(el) { if (!App.isHost || !App.s.sim) return; App.s.sim.sp = +el.dataset.v; App.s.v++; if (App.net) App.net.broadcast(true); if (App.reel) App.reel.lastUi = ''; },
  watch(el) { if (App.reel) { App.reel.watch = +el.dataset.v; App.reel.lastUi = ''; } },
  simskip() {
    if (!App.isHost || !App.s.sim) return;
    const R = ensureReel(), t = simTime(), seg = locateSeg(R, t);
    const firstKo = R.segs.find(x => x.kind === 'ko');
    App.s.sim.t = seg.kind === 'md' && firstKo ? firstKo.start : R.total;
    App.s.v++;
    if (App.net) App.net.broadcast(true);
  },
  again() { if (App.isHost) { E.resetToLobby(App.s); App.reel = null; App.screen = ''; if (App.net) App.net.broadcast(true); render(); } },
};
document.addEventListener('click', ev => {

document.addEventListener('keydown', ev => {

  if (ev.key === 'Enter' && ev.target.id === 'bidamt') { ev.preventDefault(); (App.s && App.s.cfg.sealed ? handlers.seal : handlers.bidc)(); return; }
  if (ev.target.tagName === 'INPUT' || !App.s || App.s.phase !== 'auction' || ev.metaKey || ev.ctrlKey) return;
  const map = { 1: 'q0', 2: 'q1', 3: 'q2', x: 'outbtn' };
  const b = $(map[ev.key.toLowerCase()]);
  if (b && !b.disabled) b.click();
});
document.addEventListener('submit', ev => ev.preventDefault());
document.addEventListener('input', ev => {
  if (ev.target.id === 'mgrname') STORE.set('ggg-name', ev.target.value);
  if (ev.target.id === 'joincode') ev.target.value = ev.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
});

// ---- boot ----
const start = data => {
  if (data && data.s && !data.online) { App.s = data.s; App.isHost = true; }
  let wanted = '';
  try { const m = /^#join-([A-Za-z0-9]{5})$/.exec(location.hash); if (m) wanted = m[1].toUpperCase(); } catch (e) { /* no hash here */ }
  render();
  if (wanted && $('joincode')) $('joincode').value = wanted;
  requestAnimationFrame(frame);
  const finish = api => { App.roomApi = api || null; if (!App.s) render(); if (wanted && $('joincode')) $('joincode').value = wanted; };
  if (window.GGG_ROOM) finish(window.GGG_ROOM);
  else if (window.claude && window.claude.use) window.claude.use('room').then(finish, () => finish(null));
  else finish(null);
  if (wanted && !App.s) { App.msg = `You're invited to lobby ${wanted}. Enter your name and press Join lobby.`; render(); if ($('joincode')) $('joincode').value = wanted; }
};
if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  try { window.claude.hot.snapshot(() => ({ s: App.net ? null : App.s, online: !!App.net })); } catch (e) { /* older viewer */ }
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script></body></html>
